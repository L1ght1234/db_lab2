services:
  postgres:
    image: postgres:16-alpine
    container_name: sports_lab2_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sports_nosql_lab2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - pg_lab2_data:/var/lib/postgresql/data
      - ./sql:/sql:ro

  mongo:
    image: mongo:7
    container_name: sports_lab2_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_lab2_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: sports_lab2_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_lab2_data:/data

volumes:
  pg_lab2_data:
  mongo_lab2_data:
  redis_lab2_data:
